name: Navigation core compatibility probe
on:
  push:
    branches: [experiment/navigation-core]
    paths:
      - '.github/workflows/navigation-core-probe.yml'
      - 'NavigationResearch/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned upstream
        run: |
          git clone https://github.com/maplibre/maplibre-navigation-ios.git "$RUNNER_TEMP/navigation"
          git -C "$RUNNER_TEMP/navigation" checkout 264af37aafc257d96090576a836ccbe03448e9d6
          test -s "$RUNNER_TEMP/navigation/LICENSE.md"
          cd "$RUNNER_TEMP/navigation"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Package.swift")
          s = p.read_text()
          marker = "products: ["
          assert s.count(marker) == 1
          p.write_text(s.replace(marker, marker + '\n        .library(name: "MapboxCoreNavigation", targets: ["MapboxCoreNavigation"]),', 1))
          PY
      - name: Generate isolated iOS probe
        run: |
          brew install xcodegen
          mkdir -p "$RUNNER_TEMP/probe/Sources"
          cd "$RUNNER_TEMP/probe"
          cat > project.yml <<'YAML'
          name: CoreProbe
          options:
            deploymentTarget:
              iOS: "17.0"
          packages:
            Navigation:
              path: ../navigation
            Directions:
              url: https://github.com/flitsmeister/mapbox-directions-swift
              exactVersion: 0.23.5
          targets:
            CoreProbe:
              type: application
              platform: iOS
              sources: [Sources]
              dependencies:
                - package: Navigation
                  product: MapboxCoreNavigation
                - package: Directions
                  product: MapboxDirections
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.mapx.coreprobe
                  GENERATE_INFOPLIST_FILE: YES
                  CODE_SIGNING_ALLOWED: NO
            CoreProbeTests:
              type: bundle.unit-test
              platform: iOS
              sources: [Tests]
              dependencies:
                - target: CoreProbe
              settings:
                base:
                  GENERATE_INFOPLIST_FILE: YES
                  PRODUCT_BUNDLE_IDENTIFIER: com.mapx.coreprobe.tests
          schemes:
            CoreProbe:
              build:
                targets:
                  CoreProbe: all
              test:
                targets: [CoreProbeTests]
          YAML
          cat > Sources/Probe.swift <<'SWIFT'
          import SwiftUI
          import MapKit
          import MapboxCoreNavigation
          import MapboxDirections

          struct ProbeSample {
              let legs: Int
              let steps: Int
              let initialDistance: Double
              let remainingDistance: Double
              let remainingDuration: Double
          }

          @inline(never) func runRouteProgressProbe() throws -> ProbeSample {
              let route = try RouteProgressProbe.makeFixture()
              let progress = RouteProgress(route: route)
              let initial = progress.distanceRemaining
              progress.currentLegProgress.currentStepProgress.distanceTraveled = 55.5
              return ProbeSample(legs: route.legs.count, steps: route.legs[0].steps.count,
                                 initialDistance: initial, remainingDistance: progress.distanceRemaining,
                                 remainingDuration: progress.durationRemaining)
          }

          @main
          struct CoreProbeApp: App {
              var body: some Scene {
                  WindowGroup { Map() }
              }
          }

          // Compile-time coexistence check only. No routing requests or GPS.
          func probe(_ appleRoute: MKRoute, _ core: RouteController) -> Double {
              appleRoute.distance + (core.location?.horizontalAccuracy ?? 0)
          }
          SWIFT
          cp "$GITHUB_WORKSPACE/NavigationResearch/AppleRouteSnapshot.swift" Sources/
          cp "$GITHUB_WORKSPACE/NavigationResearch/RouteProgressProbe.swift" Sources/
          mkdir -p Tests
          cat > Tests/RouteTests.swift <<'SWIFT'
          import XCTest
          @testable import CoreProbe
          final class RouteTests: XCTestCase {
              func testSyntheticRouteProgress() throws {
                  let sample = try runRouteProgressProbe()
                  XCTAssertEqual(sample.legs, 1)
                  XCTAssertEqual(sample.steps, 1)
                  XCTAssertEqual(sample.initialDistance, 111, accuracy: 0.01)
                  XCTAssertEqual(sample.remainingDistance, 55.5, accuracy: 0.01)
                  XCTAssertEqual(sample.remainingDuration, 15, accuracy: 0.01)
              }
          }
          SWIFT
          xcodegen generate
      - name: Compile core and MapKit together
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/probe"
          xcodebuild -project CoreProbe.xcodeproj -scheme CoreProbe -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tee "$RUNNER_TEMP/core-probe.log"
      - name: Run offline route progress tests
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/probe"
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in sorted(d.items(),reverse=True) if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          xcodebuild -project CoreProbe.xcodeproj -scheme CoreProbe -configuration Debug -destination "id=$DEVICE" CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO test | tee -a "$RUNNER_TEMP/core-probe.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-probe-log
          path: ${{ runner.temp }}/core-probe.log
          if-no-files-found: warn
