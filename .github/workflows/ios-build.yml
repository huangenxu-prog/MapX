name: iOS Build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild -project MapX.xcodeproj -scheme MapX \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/MapXSimulator" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Build unsigned iPhone app
        run: |
          set -euo pipefail
          xcodebuild -project MapX.xcodeproj -scheme MapX \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/MapXDevice" \
            CODE_SIGNING_ALLOWED=NO build
          APP="$RUNNER_TEMP/MapXDevice/Build/Products/Release-iphoneos/MapX.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c "Print :UILaunchScreen" "$APP/Info.plist"
          plutil -lint "$APP/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "6"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$APP/Info.plist" | grep -q location
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$APP/Info.plist" | grep -q audio
          mkdir -p "$RUNNER_TEMP/MapXPackage/Payload"
          cp -R "$APP" "$RUNNER_TEMP/MapXPackage/Payload/MapX.app"
          (cd "$RUNNER_TEMP/MapXPackage" && zip -qry "$GITHUB_WORKSPACE/MapX-unsigned.ipa" Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: MapX-unsigned-ipa
          path: MapX-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
