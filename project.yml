name: MapX
options:
  bundleIdPrefix: com.huangenxu
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "7"
targets:
  MapX:
    type: application
    platform: iOS
    sources:
      - path: MapX
    info:
      path: MapX/Info.plist
      properties:
        CFBundleDisplayName: MapX
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "7"
        NSLocationWhenInUseUsageDescription: "MapX 在地图显示和导航时使用位置；开始导航后锁屏仍会持续定位，以提供转向提示。"
        UIBackgroundModes:
          - location
          - audio
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.huangenxu.MapX
        CODE_SIGNING_ALLOWED: NO
