name: MapX
options:
  bundleIdPrefix: com.huangenxu
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  MapX:
    type: application
    platform: iOS
    sources:
      - path: MapX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.huangenxu.MapX
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "MapX uses your location to show your position and plan routes."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CODE_SIGNING_ALLOWED: NO
